name: core

# Builds the `core` binary — the developer CLI the whole CoreGO ecosystem grew
# out of — with dAppCore/build.
#
# The binary is the point of the exercise. It composes dappco.re/go/build and
# dappco.re/go/lint, so a machine with `core` on it has the build and QA
# tooling for everything else without installing anything further. Publishing
# it on a tag is what makes that true for a CI runner as well as a desk.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: core on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Build core
        id: build
        uses: dAppCore/build@v4
        with:
          build-name: core
          # cmd/core is its own module rather than a package of the parent one,
          # so the module root is named explicitly. Detection would otherwise
          # find go/go.mod and build the library module, which has no command.
          go-directory: go/cmd/core
          main-package: "."
          STACK: go
          # Explicit, so the root action's darwin/universal default — a Wails v2
          # idea with no Go equivalent — does not reach the toolchain. Each
          # runner builds for itself; the matrix is what covers the platforms.
          build-platform: ""
          # Stamped from the ref so `core --version` reports something true
          # rather than the 0.0.0 it currently prints.
          ldflags: -s -w -X main.version=${{ github.ref_name }}
          # An artifact on every run; a release only on a tag.
          package: true

      - name: Check the binary answers
        # No working-directory: BINARY_PATH is relative to
        # app-working-directory, which is the repository root.
        shell: bash
        run: |
          set -euo pipefail
          BIN="${{ steps.build.outputs.BINARY_PATH }}"
          test -f "$BIN"

          # --help now prints the same catalog as a bare invocation and exits 0.
          # It is colourised, so ANSI is stripped before matching — grepping the
          # raw output silently matches nothing, which would make this check
          # pass for the wrong reason if it were ever inverted.
          "./$BIN" --help 2>/dev/null | sed -E 's/\x1b\[[0-9;]*m//g' > surfaces.txt
          cat surfaces.txt

          # `build` comes from dappco.re/go/build; `go qa` and `qa audit` from
          # dappco.re/go/lint. Absent means one failed to compose, which is the
          # whole reason this binary is interesting.
          for surface in "build" "go qa" "qa audit" "doctor" "release"; do
            grep -qE "^  ${surface}( |\$)" surfaces.txt \
              || { echo "::error::'$surface' missing — a command surface did not register"; exit 1; }
          done
          echo "[DEBUG_LOG] $(grep -cE '^  [a-z]' surfaces.txt) command surfaces registered"

          # Both invocations must agree. They used to print different catalogs:
          # bare rendered pkg/cli's space-separated one, --help fell through to
          # core/go's slash-path one and exited 1.
          "./$BIN" 2>/dev/null | sed -E 's/\x1b\[[0-9;]*m//g' > bare.txt
          diff -q bare.txt surfaces.txt \
            || { echo "::error::core and core --help disagree"; exit 1; }

      - name: Every help invocation exits 0
        shell: bash
        run: |
          set -uo pipefail
          BIN="${{ steps.build.outputs.BINARY_PATH }}"
          # Asserted rather than reported: --help used to exit 1, which is the
          # first thing a user or a script tries.
          for form in "--help" "-h" "help" ""; do
            "./$BIN" $form >/dev/null 2>&1
            code=$?
            echo "[DEBUG_LOG] core ${form:-<bare>} exit=$code"
            [ "$code" -eq 0 ] || { echo "::error::core ${form:-<bare>} exits $code"; exit 1; }
          done
