# Core CLI build configuration
# Used by: core build

version: 1

project:
  name: core
  description: Host UK Core CLI
  main: "."
  binary: core

build:
  cgo: false
  flags:
    - -trimpath
  ldflags:
    - -s
    - -w
    # The variable lives in pkg/cli, not main. -X names a package-qualified
    # symbol and discards one it cannot find without a word, which is how
    # builds kept reporting 0.0.0.
    - -X dappco.re/go/cli/pkg/cli.AppVersion={{.Version}}
  env: []

targets:
  - os: linux
    arch: amd64
  - os: linux
    arch: arm64
  - os: darwin
    arch: amd64
  - os: darwin
    arch: arm64
  - os: windows
    arch: amd64
